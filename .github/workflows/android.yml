name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: "Опубликовать OTA-обновление в ветку updates"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test
        working-directory: server

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Подготовить ключ подписи
        id: signing
        run: |
          {
            echo "PULSE_KEYSTORE=$GITHUB_WORKSPACE/android/signing/pulse-release.jks"
            echo "PULSE_STORE_PASSWORD=mcBE4xbs21X-QPTjdrkPt84h"
            echo "PULSE_KEY_ALIAS=pulse"
            echo "PULSE_KEY_PASSWORD=mcBE4xbs21X-QPTjdrkPt84h"
          } >> "$GITHUB_ENV"
          echo "task=assembleRelease" >> "$GITHUB_OUTPUT"
          echo "dir=release" >> "$GITHUB_OUTPUT"

      - name: Собрать APK
        run: gradle -p android --no-daemon :app:${{ steps.signing.outputs.task }}

      - name: Назвать APK по версии
        id: apk
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' android/app/build.gradle.kts)
          CODE=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' android/app/build.gradle.kts)
          SRC=$(ls android/app/build/outputs/apk/${{ steps.signing.outputs.dir }}/*.apk | head -1)
          mkdir -p out && cp "$SRC" "out/PulseMessenger-$VERSION.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: PulseMessenger-${{ steps.apk.outputs.version }}
          path: out/*.apk

      - name: Выложить APK в GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.apk.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/*.apk --clobber
          else
            gh release create "$TAG" out/*.apk --target "$GITHUB_SHA" --title "Pulse Messenger ${{ steps.apk.outputs.version }}" --notes "Сборка ${{ steps.signing.outputs.dir }} из коммита $GITHUB_SHA"
          fi

      - name: Опубликовать OTA-обновление
        run: |
          git fetch --depth 1 origin updates:refs/remotes/origin/updates
          PUBLISHED=$(git show origin/updates:latest.json | sed -n 's/.*"versionCode": *\([0-9]*\).*/\1/p')
          if [ "${{ steps.apk.outputs.code }}" -le "${PUBLISHED:-0}" ]; then
            echo "Версия ${{ steps.apk.outputs.code }} не новее опубликованной $PUBLISHED — OTA пропущено"
            exit 0
          fi
          VERSION=${{ steps.apk.outputs.version }}
          CODE=${{ steps.apk.outputs.code }}
          APK="PulseMessenger-$VERSION.apk"
          git worktree add ../updates origin/updates
          cd ../updates
          git checkout -B updates
          mkdir -p releases && cp "$GITHUB_WORKSPACE/out/$APK" releases/
          SHA=$(sha256sum "releases/$APK" | cut -d' ' -f1)
          cat > latest.json <<JSON
          {
            "versionCode": $CODE,
            "versionName": "$VERSION",
            "url": "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/updates/releases/$APK",
            "sha256": "$SHA"
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add releases latest.json
          git commit -m "Publish Pulse Messenger $VERSION OTA update"
          git push origin updates
