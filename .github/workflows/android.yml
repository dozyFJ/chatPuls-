name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: "Опубликовать OTA-обновление в ветку updates"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test
        working-directory: server

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Подготовить ключ подписи
        id: signing
        run: |
          {
            echo "PULSE_KEYSTORE=$GITHUB_WORKSPACE/android/signing/pulse-release.jks"
            echo "PULSE_STORE_PASSWORD=mcBE4xbs21X-QPTjdrkPt84h"
            echo "PULSE_KEY_ALIAS=pulse"
            echo "PULSE_KEY_PASSWORD=mcBE4xbs21X-QPTjdrkPt84h"
          } >> "$GITHUB_ENV"
          echo "task=assembleRelease" >> "$GITHUB_OUTPUT"
          echo "dir=release" >> "$GITHUB_OUTPUT"

      - name: Собрать APK
        run: gradle -p android --no-daemon :app:${{ steps.signing.outputs.task }} :admin:${{ steps.signing.outputs.task }}

      - name: Назвать APK по версии
        id: apk
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' android/app/build.gradle.kts)
          CODE=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' android/app/build.gradle.kts)
          SRC=$(ls android/app/build/outputs/apk/${{ steps.signing.outputs.dir }}/*.apk | head -1)
          ADMIN_VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' android/admin/build.gradle.kts)
          ADMIN_SRC=$(ls android/admin/build/outputs/apk/${{ steps.signing.outputs.dir }}/*.apk | head -1)
          mkdir -p out && cp "$SRC" "out/PulseMessenger-$VERSION.apk" && cp "$ADMIN_SRC" "out/chatPuls-Admin-$ADMIN_VERSION.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: PulseMessenger-${{ steps.apk.outputs.version }}
          path: out/*.apk

      - name: Выложить APK в GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.apk.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/*.apk --clobber
          else
            gh release create "$TAG" out/*.apk --target "$GITHUB_SHA" --title "Pulse Messenger ${{ steps.apk.outputs.version }}" --notes "Сборка ${{ steps.signing.outputs.dir }} из коммита $GITHUB_SHA"
          fi

      - name: Опубликовать OTA-обновления
        run: |
          git fetch --depth 1 origin updates:refs/remotes/origin/updates
          git worktree add ../updates origin/updates
          cd ../updates
          git checkout -B updates
          mkdir -p releases
          changed=""
          # $1 — файл манифеста, $2 — имя APK в out/, $3 — versionCode, $4 — versionName
          publish() {
            PUBLISHED=$(git show "origin/updates:$1" 2>/dev/null | sed -n 's/.*"versionCode": *\([0-9]*\).*/\1/p')
            if [ "$3" -le "${PUBLISHED:-0}" ]; then
              echo "$1: версия $3 не новее опубликованной $PUBLISHED — пропускаю"
              return
            fi
            cp "$GITHUB_WORKSPACE/out/$2" releases/
            SHA=$(sha256sum "releases/$2" | cut -d' ' -f1)
            printf '{\n  "versionCode": %s,\n  "versionName": "%s",\n  "url": "https://raw.githubusercontent.com/%s/updates/releases/%s",\n  "sha256": "%s"\n}\n' "$3" "$4" "$GITHUB_REPOSITORY" "$2" "$SHA" > "$1"
            git add "releases/$2" "$1"
            changed="$changed $2"
          }
          publish latest.json "PulseMessenger-${{ steps.apk.outputs.version }}.apk" "${{ steps.apk.outputs.code }}" "${{ steps.apk.outputs.version }}"
          ADMIN_CODE=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' "$GITHUB_WORKSPACE/android/admin/build.gradle.kts")
          ADMIN_VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' "$GITHUB_WORKSPACE/android/admin/build.gradle.kts")
          publish admin-latest.json "chatPuls-Admin-$ADMIN_VERSION.apk" "$ADMIN_CODE" "$ADMIN_VERSION"
          if [ -z "$changed" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish OTA:$changed"
          git push origin updates
